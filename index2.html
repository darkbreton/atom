<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proportions Réelles : Hydrogène (Centré)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            background-color: #020205;
            color: white;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        canvas {
            display: block;
        }

        .glass {
            background: rgba(15, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        #progress-bar {
            transition: none !important;
        }

        /* Animation pour l'apparition des messages */
        .fade-slide-up {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body>

    <!-- Interface Utilisateur -->
    <div id="ui" class="fixed inset-0 pointer-events-none z-10 p-6 flex flex-col items-center justify-between">

        <div class="flex justify-between items-start w-full">
            <div class="glass p-4 rounded-2xl pointer-events-auto hidden md:block">
                <h1 class="text-lg font-black tracking-tighter text-blue-400">HYDROGÈNE</h1>
                <p class="text-[9px] uppercase tracking-widest opacity-60">ÉCHELLE RÉELLE 1:1700</p>
            </div>

            <!-- BOUTONS CENTRÉS EN HAUT -->
            <div class="flex gap-2 pointer-events-auto">
                <button onclick="startTravel(0)"
                    class="glass btn-glow px-6 py-3 rounded-xl text-[10px] font-bold hover:bg-red-500/10 transition-all text-red-400 border-red-900/30 uppercase tracking-widest">
                    Noyau
                </button>
                <button onclick="startTravel(52917)"
                    class="bg-blue-600/90 px-6 py-3 rounded-xl text-[10px] font-bold hover:bg-blue-500 transition-all text-white uppercase tracking-widest shadow-lg shadow-blue-900/40">
                    Électron
                </button>
            </div>

            <div class="glass p-4 rounded-2xl text-right pointer-events-auto min-w-[150px]">
                <div class="text-[9px] uppercase tracking-widest opacity-50">Position</div>
                <div class="text-2xl font-mono text-blue-300"><span id="dist-val">0</span> <span
                        class="text-xs">fm</span></div>
            </div>
        </div>

        <div class="flex flex-col items-center gap-6 w-full max-w-2xl mb-8">

            <!-- Vitesse de croisière -->
            <div id="speed-display"
                class="glass px-4 py-1.5 rounded-full text-center pointer-events-auto opacity-0 transition-opacity duration-500">
                <div class="text-[9px] font-mono text-cyan-400 uppercase tracking-tighter">Vitesse : 1 764 fm/s</div>
            </div>

            <!-- MESSAGES CENTRÉS -->
            <div id="message-box"
                class="glass px-8 py-5 rounded-2xl w-full text-center opacity-0 transform translate-y-4 pointer-events-auto fade-slide-up">
                <p id="message-text" class="text-sm font-medium leading-relaxed text-blue-100 italic"></p>
            </div>

            <!-- BARRE DE PROGRESSION CLICABLE -->
            <div class="w-full flex flex-col items-center">
                <div onclick="jumpToPosition(event)"
                    class="pointer-events-auto w-full h-6 flex items-center cursor-pointer group">
                    <div
                        class="w-full h-2 bg-white/5 rounded-full overflow-hidden group-hover:bg-white/10 transition-colors relative border border-white/5">
                        <div id="progress-bar"
                            class="h-full bg-gradient-to-r from-blue-600 to-cyan-400 w-0 pointer-events-none"></div>
                    </div>
                </div>
                <div class="flex justify-between w-full mt-1 px-1">
                    <span class="text-[8px] uppercase opacity-30 tracking-widest">Noyau</span>
                    <span class="text-[8px] uppercase opacity-30 tracking-widest">Électron</span>
                </div>
            </div>
        </div>
    </div>

    <canvas id="atomCanvas"></canvas>

    <script>
        const canvas = document.getElementById('atomCanvas');
        const ctx = canvas.getContext('2d');

        const FM_TO_PX = 1000;
        const TARGET_DISTANCE_FM = 52917;
        const TARGET_DISTANCE_PX = TARGET_DISTANCE_FM * FM_TO_PX;
        const NUCLEUS_RADIUS_PX = 850;
        const FULL_TRAVEL_TIME_MS = 30000;
        const MANUAL_SCROLL_FACTOR = 50;

        let width, height;
        let currentPos = 0;

        let isMoving = false;
        let startPos = 0;
        let destinationPos = 0;
        let startTime = 0;
        let travelDuration = 0;

        const messages = [
            { d: 0, t: "Surface du noyau. Un proton de 1.7 femtomètres." },
            { d: 500, t: "Le noyau disparaît déjà... Seul le vide absolu subsiste." },
            { d: 5000, t: "À cette échelle, si le noyau était une bille dans un stade, l'électron serait un moucheron dans les gradins." },
            { d: 15000, t: "Si on retirait ce vide de tous les atomes, l'humanité entière tiendrait dans un morceau de sucre." },
            { d: 25000, t: "Ce vide est parcouru par des forces invisibles qui empêchent vos mains de traverser les objets." },
            { d: 35000, t: "99,9999% de l'atome est composé de ce vide que vous traversez actuellement." },
            { d: 51500, t: "Approche de l'électron. Détection du nuage de probabilité quantique." }
        ];

        function jumpToPosition(event) {
            interruptAutoTravel();
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const percentage = x / rect.width;
            currentPos = percentage * TARGET_DISTANCE_PX;
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function interruptAutoTravel() {
            if (isMoving) {
                isMoving = false;
                document.getElementById('speed-display').style.opacity = "0";
            }
        }

        window.addEventListener('wheel', (e) => {
            interruptAutoTravel();
            currentPos += e.deltaY * MANUAL_SCROLL_FACTOR;
            currentPos = Math.max(0, Math.min(currentPos, TARGET_DISTANCE_PX));
        });

        function startTravel(targetFm) {
            startPos = currentPos;
            destinationPos = targetFm * FM_TO_PX;
            const distanceToTravel = Math.abs(destinationPos - startPos);
            if (distanceToTravel === 0) return;

            travelDuration = (distanceToTravel / TARGET_DISTANCE_PX) * FULL_TRAVEL_TIME_MS;
            startTime = performance.now();
            isMoving = true;
            document.getElementById('speed-display').style.opacity = "1";
        }

        function drawNucleus(y) {
            const radius = NUCLEUS_RADIUS_PX;
            const grad = ctx.createRadialGradient(width / 2, y, 0, width / 2, y, radius);
            grad.addColorStop(0, '#ff4d4d');
            grad.addColorStop(0.7, '#800000');
            grad.addColorStop(1, '#020205');

            ctx.beginPath();
            ctx.arc(width / 2, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // Texture atomique pour simuler le mouvement
            ctx.fillStyle = "rgba(255,255,255,0.04)";
            for (let i = 0; i < 150; i++) {
                let angle = (i * 137.5) * Math.PI / 180;
                let r = Math.sqrt(i / 150) * radius;
                ctx.beginPath();
                ctx.arc(width / 2 + Math.cos(angle) * r, y + Math.sin(angle) * r, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawElectron(y) {
            // Nuage de probabilité (Orbitale)
            const orbitGrad = ctx.createRadialGradient(width / 2, y, 0, width / 2, y, 200);
            orbitGrad.addColorStop(0, `rgba(77, 166, 255, 0.2)`);
            orbitGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = orbitGrad;
            ctx.beginPath();
            ctx.arc(width / 2, y, 200, 0, Math.PI * 2);
            ctx.fill();

            // L'électron réel (Point ponctuel)
            ctx.fillStyle = '#4da6ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#4da6ff';
            ctx.fillRect(width / 2 - 1, y - 1, 2, 2);
            ctx.shadowBlur = 0;

            ctx.font = "bold 10px Inter";
            ctx.fillStyle = "#4da6ff";
            ctx.textAlign = "center";
            ctx.fillText("ÉLECTRON (1 PX)", width / 2, y + 30);
        }

        function animate(time) {
            if (isMoving) {
                const elapsed = time - startTime;
                if (elapsed >= travelDuration) {
                    currentPos = destinationPos;
                    isMoving = false;
                    document.getElementById('speed-display').style.opacity = "0";
                } else {
                    const progress = elapsed / travelDuration;
                    currentPos = startPos + (destinationPos - startPos) * progress;
                }
            }

            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, width, height);

            const centerY = height / 2;
            const nucleusY = centerY - currentPos;
            const electronY = centerY + TARGET_DISTANCE_PX - currentPos;

            // Optimisation : On ne dessine que si l'objet est proche de l'écran
            if (nucleusY + NUCLEUS_RADIUS_PX > -100 && nucleusY - NUCLEUS_RADIUS_PX < height + 100) {
                drawNucleus(nucleusY);
            }
            if (electronY > -200 && electronY < height + 200) {
                drawElectron(electronY);
            }

            const currentFm = (currentPos / FM_TO_PX);
            document.getElementById('dist-val').innerText = Math.floor(currentFm).toLocaleString();
            document.getElementById('progress-bar').style.width = (currentPos / TARGET_DISTANCE_PX * 100) + "%";

            // Mise à jour des messages
            const activeMsg = [...messages].reverse().find(m => currentFm >= m.d);
            const msgBox = document.getElementById('message-box');
            if (activeMsg && currentFm < TARGET_DISTANCE_FM - 20) {
                document.getElementById('message-text').innerText = activeMsg.t;
                msgBox.style.opacity = "1";
                msgBox.style.transform = "translateY(0)";
            } else {
                msgBox.style.opacity = "0";
                msgBox.style.transform = "translateY(10px)";
            }

            requestAnimationFrame(animate);
        }

        window.onload = () => requestAnimationFrame(animate);
    </script>
</body>

</html>
